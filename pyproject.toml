[project]
name = "product-development-workflow"
version = "0.1.0"
description = "A guided LangChain and Deep Agents workflow for product development"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.30.1",
    "fastapi>=0.111.0",
    "langchain-anthropic>=0.1.19",
    "langchain-core>=0.2.11",
    "langgraph>=0.1.5",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langgraph-checkpoint-postgres>=1.0.0",
    "pydantic>=2.8.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.1",
    "gunicorn>=22.0.0",
    "langsmith>=0.1.84",
    "pydantic-settings>=2.4.0",
    "sse-starlette>=2.1.2",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    # Symmetric encryption for the provider credentials an administrator stores
    # through the Settings page. Declared explicitly rather than relied on
    # transitively: `runtime_settings._fernet` imports it at call time, so a
    # resolver change that dropped it would break credential *decryption* on a
    # running deployment, not at install and not with an import error at startup.
    "cryptography>=42.0.0",
    "psycopg2-binary>=2.9.9",
    # psycopg v3 is what langgraph-checkpoint-postgres uses. The [binary]
    # extra bundles libpq, which a python:slim runtime image does not have.
    "psycopg[binary,pool]>=3.2.0",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "websockets>=13.0.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # No `hvac`: no code in this tree talks to Vault. The only secret backend is
    # the Fernet key in `runtime_settings._fernet`. A declared but unused
    # security-adjacent dependency reads as "Vault is configured" in an audit,
    # when it is not. Re-add it alongside the code that uses it.
    "langchain-google-genai>=4.4.0",
    "deepagents>=0.7.13",
    "jinja2>=3.1.0",
    "langchain-openai>=1.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "python-json-logger>=2.0.7",
    # S3-compatible object storage (MinIO in compose, any provider in cloud).
    # A deployment that leaves OBJECT_STORE_BUCKET unset never imports it, but
    # it ships by default so enabling durable storage is a config change rather
    # than an image rebuild.
    "boto3>=1.35.0",
    "tree-sitter-language-pack<1",
    "langchain-mcp-adapters>=0.1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "testcontainers[postgres,redis]>=3.7.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The document templates are read from disk at render time, so an installed copy
# of the package needs them beside the code. See `app.doc_templates`.
[tool.setuptools.package-data]
"app.doc_templates" = ["templates/*.md.j2"]

[tool.coverage.run]
branch = true
source = ["src/app"]
# Per module, never per directory: a directory glob hid every unwired module
# beneath it - `deploy/`, `scaffolding/`, `build/` and `static_analyzer` sat in
# one for weeks with no caller at all. Those modules are gone, and
# `tests/test_every_module_is_reached.py` fails on the next one.
omit = [
    # CLI entry point. Runs the whole workflow interactively; covered by
    # end-to-end runs, not by unit tests.
    "src/app/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = "--cov=src/app --cov-fail-under=80 --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
# The stored locked suites are data replayed by a test, not tests to run: two are Python suites that need a running service.
norecursedirs = ["tests/fixtures/locked_suites"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "testcontainers[postgres,redis]>=4.15.0",
]
