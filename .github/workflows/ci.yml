name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Python backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    # 3.13 informs and does not gate: docstring indentation changed there once
    # already (the command tool's network sentence), and the image runs 3.12.
    continue-on-error: ${{ matrix.python == '3.13' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system ".[test]"

      - name: Run tests
        # Coverage gate comes from pyproject; testcontainers uses the runner's
        # Docker daemon, so no service containers are declared here.
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src
          ENV: development

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langchain-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: langchain-ui/package-lock.json

      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: pip install uv pip-audit bandit

      - name: Dependency vulnerabilities
        run: |
          uv pip install --system .
          pip-audit --strict

      - name: Static analysis
        # Only the application package; tests deliberately contain
        # attack-shaped strings that would trip the scanner.
        run: bandit -r src/app -ll -x src/app/tests

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Image build and scan
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t langchain-app:ci .

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: langchain-app:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
