# Production-shaped stack. For local development with hot reload, use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Every service that others depend on has a healthcheck, and dependents wait for
# it rather than racing startup. Nothing runs as root, nothing is unbounded, and
# no source tree is mounted over the built image.

# Required values are NOT enforced with compose's `${VAR:?}` syntax. That fires
# during interpolation, which happens for every command including `build` and
# `config` - so it made it impossible to build an image without runtime secrets.
#
# Enforcement lives with the component that can actually check it at start:
#   POSTGRES_PASSWORD  the postgres image refuses to initialise without one
#   JWT_SECRET_KEY     app.server.auth raises unless ENV is a development value
#   ADMIN_PASSWORD     init_db raises unless ENV is a development value
# Nothing can start insecurely; only `build` stops needing secrets it never used.
x-app-env: &app-env
  ENV: ${ENV:-production}
  MODEL_REQUEST_TIMEOUT_SECONDS: 1800
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
  AUTH_DB_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-langchain}"
  DB_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-langchain}"
  REDIS_URL: "redis://redis:6379/0"
  DATA_DIR: /app/data
  WORKFLOW_UPLOAD_DIR: /app/data/uploads
  WORKFLOW_WORKSPACE_ROOT: /app/data/workspaces
  # What the stages may reach beyond the workspace (docs/HANDOVER.md section 2.0):
  # registries, documentation, runtimes, the running page, a setup stage for a
  # stack no pack covers. Each is on unless set to false. MCP servers are the
  # owner's choice and off until configured (app/tools/mcp_tools.py).
  PACKAGE_LOOKUP_ENABLED: ${PACKAGE_LOOKUP_ENABLED:-true}
  DOCS_LOOKUP_ENABLED: ${DOCS_LOOKUP_ENABLED:-true}
  # The web, for what is newer than the model (app/tools/web_search.py): the
  # private SearXNG below. And the official MCP server of a library the product
  # uses, found in the MCP Registry (app/tools/mcp_registry.py): remote, read-only.
  WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
  SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  HARNESS_MCP_DISCOVERY: ${HARNESS_MCP_DISCOVERY:-true}
  SANDBOX_RUNTIMES_ENABLED: ${SANDBOX_RUNTIMES_ENABLED:-true}
  # Feature switches (owner 2026-10-29): bug fixes are built in and always on; the premium
  # features come in four bundles over the free base; experiments stay off until measured.
  # See `app.switches` for what each bundle holds.
  PREMIUM_MODEL_TUNING: ${PREMIUM_MODEL_TUNING:-on}
  PREMIUM_PROJECT_INTELLIGENCE: ${PREMIUM_PROJECT_INTELLIGENCE:-on}
  PREMIUM_DEEP_VERIFICATION: ${PREMIUM_DEEP_VERIFICATION:-on}
  PREMIUM_CHANGE_REQUESTS: ${PREMIUM_CHANGE_REQUESTS:-on}
  OBSERVATION_FOLDING: ${OBSERVATION_FOLDING:-off}
  BATCH_ACCEPTANCE_AUTHOR: ${BATCH_ACCEPTANCE_AUTHOR:-off}
  TARGETED_SUITE_REPAIR: ${TARGETED_SUITE_REPAIR:-on}
  STRUCTURED_DISPUTE_VERDICT: ${STRUCTURED_DISPUTE_VERDICT:-on}
  AGENT_LOOP_FIX_LIMITS: ${AGENT_LOOP_FIX_LIMITS:-on}
  SURRENDER_TO_REWRITE: ${SURRENDER_TO_REWRITE:-on}
  KEPT_FIX_CANDIDATES: ${KEPT_FIX_CANDIDATES:-on}
  CO_DEFECT_FAILURES_IN_REWRITES: ${CO_DEFECT_FAILURES_IN_REWRITES:-on}
  REPEATED_REWRITE_PROMPT_STOP: ${REPEATED_REWRITE_PROMPT_STOP:-on}
  STABLE_STAGE_PREFIX: ${STABLE_STAGE_PREFIX:-off}
  NAMED_TEST_REWRITE: ${NAMED_TEST_REWRITE:-off}
  TESTS_ONLY_WRITES: ${TESTS_ONLY_WRITES:-off}
  MUTANT_CHECK_IN_THE_FIX_STAGE: ${MUTANT_CHECK_IN_THE_FIX_STAGE:-off}
  MUTATION_TEST_RETENTION: ${MUTATION_TEST_RETENTION:-off}
  EQUIVALENT_MUTANTS_REMEMBERED: ${EQUIVALENT_MUTANTS_REMEMBERED:-off}
  MUTATION_GUIDED_TESTS_CHANGES: ${MUTATION_GUIDED_TESTS_CHANGES:-6}
  # Switches set on the admin page (/admin) beat the values above, in every process (`app.switches`).
  SWITCH_OVERRIDES_FROM_SETTINGS: ${SWITCH_OVERRIDES_FROM_SETTINGS:-on}
  PAGE_VIEW_ENABLED: ${PAGE_VIEW_ENABLED:-true}
  CUSTOM_STACK_SETUP: ${CUSTOM_STACK_SETUP:-true}
  # At most this many agents of one run at once in parallel mode: work orders,
  # defect fixes and reviews (`workflow.max_parallel`).
  HARNESS_MAX_PARALLEL: ${HARNESS_MAX_PARALLEL:-6}
  # fast or thorough (app.delivery); the settings page overrides it.
  DELIVERY_MODE: ${DELIVERY_MODE:-fast}
  FAST_CODE_REVIEW: ${FAST_CODE_REVIEW:-false}
  # Harness switches, for A/B runs set from .env. Empty means the code's own
  # default, at every one of these (tests/test_the_toggles_reach_the_container.py).
  LINE_EDITS: ${LINE_EDITS:-}
  ENVIRONMENT_CONTRACT: ${ENVIRONMENT_CONTRACT:-}
  WORKSPACE_DIGEST: ${WORKSPACE_DIGEST:-}
  PROJECT_MEMORY: ${PROJECT_MEMORY:-}
  HARNESS_TASK_LIST: ${HARNESS_TASK_LIST:-}
  ESCALATE_AFTER_ATTEMPTS: ${ESCALATE_AFTER_ATTEMPTS:-}
  ALREADY_KNOWN: ${ALREADY_KNOWN:-}
  HARNESS_MCP_SERVERS: ${HARNESS_MCP_SERVERS:-}
  CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
  # Postgres, so the API and the worker share one checkpoint store. SQLite put a
  # separate database inside each container's ephemeral layer.
  CHECKPOINTER_TYPE: ${CHECKPOINTER_TYPE:-postgres}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  # Execution is opt-in.
  ALLOW_COMMAND_EXECUTION: ${ALLOW_COMMAND_EXECUTION:-false}
  # Where a validated command runs.
  #   container    - one throwaway container per command. Strongest containment
  #                  of the command, but needs the Docker socket mounted below,
  #                  and that socket is root-equivalent on the host.
  #   in-container - directly in the worker, as the unprivileged user, in the
  #                  run's workspace. The command reaches what the worker
  #                  reaches; the host is not exposed at all.
  SANDBOX_EXECUTION_MODE: ${SANDBOX_EXECUTION_MODE:-container}
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: "${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}"
  METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  # Shared metric storage. The recorders run in the worker and `/metrics` is
  # served by the app, so a per-process registry can only report what the API
  # itself increments - `run_total` moved and `stage_duration_seconds` stayed
  # empty forever. Both services mount `appdata`, so they share this directory.
  # Unset it to go back to per-process metrics.
  PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/app/data/prometheus}
  # Per-run spending ceiling in US dollars; empty or 0 disables it. A run that
  # reaches it pauses at the next stage boundary as `waiting_for_budget` and
  # waits for a person - it does not fail. See .env.example.
  MAX_RUN_COST_USD: ${MAX_RUN_COST_USD:-}
  MAX_RUN_TOKENS: ${MAX_RUN_TOKENS:-}
  # Runs that may execute at once; unset or 0 means no limit. This
  # deployment's model server answers one request at a time, so two runs
  # contend rather than go faster - measured 2026-09-20, when orphan
  # recovery resumed one run as another was started.
  MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-}
  # JSON corrections to the built-in model price table.
  MODEL_PRICES_JSON: ${MODEL_PRICES_JSON:-}
  # Encrypts provider credentials set through the settings page. Falls back
  # to deriving from JWT_SECRET_KEY, so rotating that one makes stored
  # credentials unreadable until they are re-entered.
  SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:-}"
  # Set to refuse credential and provider changes through the API entirely.
  SETTINGS_READ_ONLY: ${SETTINGS_READ_ONLY:-}
  # Durable storage for uploads and run artifacts. Unset OBJECT_STORE_BUCKET to
  # fall back to the local filesystem under DATA_DIR/objects; the code path is
  # the same either way, so this is a deployment choice rather than a code one.
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-}
  OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-}
  OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  OBJECT_STORE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-}"
  # TLS terminates outside the compose network; MinIO is reached over http here.
  OBJECT_STORE_SECURE: ${OBJECT_STORE_SECURE:-false}
  # Seeding a workspace from an existing codebase. HTTPS only, and public hosts
  # only, unless an operator has a reason to widen either.
  SEED_ALLOWED_SCHEMES: ${SEED_ALLOWED_SCHEMES:-}
  SEED_ALLOW_PRIVATE_HOSTS: ${SEED_ALLOW_PRIVATE_HOSTS:-false}
  # ---------------------------------------------------------------------------
  # Context compaction
  # ---------------------------------------------------------------------------
  # The model's context window, in tokens. This is the only context number that
  # needs setting: every budget below is derived from it by
  # `app.agents.context_budget`. It is also editable per model in Settings,
  # which is where it belongs - the window and the model change together.
  #
  # The derived budgets (CTX_MAX_TOKENS, CTX_KEEP_MESSAGES,
  # MODEL_MAX_OUTPUT_TOKENS, SANDBOX_MAX_OUTPUT, CTX_ARCHITECT_DOCUMENT_BUDGET,
  # CTX_REVISION_DOCUMENT_BUDGET, CTX_SPECIFICATION_BUDGET) are deliberately
  # NOT given defaults here. A default here wins over the derivation, which is
  # how a budget tuned for one model silently stayed in force under another.
  # Set one only to override the derivation on purpose.
  MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-100000}
  # Per-process heap for a sandboxed command, applied as RLIMIT_DATA. A test
  # runner forks one worker per CPU and each gets this much, so it must leave
  # room for several inside the worker container's own memory limit.
  SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-1g}
  CTX_COMPACTION_ENABLED: ${CTX_COMPACTION_ENABLED:-true}
  CTX_SOFT_TRIGGER_RATIO: ${CTX_SOFT_TRIGGER_RATIO:-0.8}
  CTX_SUMMARY_BUDGET: ${CTX_SUMMARY_BUDGET:-4000}
  CTX_COMPACTION_MODEL: ${CTX_COMPACTION_MODEL:-}
  CTX_STORE_ROOT: ${CTX_STORE_ROOT:-}
  CTX_JOURNAL_ROOT: ${CTX_JOURNAL_ROOT:-}
  CTX_JOURNAL_RETENTION_HOURS: ${CTX_JOURNAL_RETENTION_HOURS:-72}
  CTX_CONTEXT_RETENTION_HOURS: ${CTX_CONTEXT_RETENTION_HOURS:-72}
  STREAM_AGENT_ACTIVITY: ${STREAM_AGENT_ACTIVITY:-true}
  WORKFLOW_MAX_GATES_PER_STAGE: ${WORKFLOW_MAX_GATES_PER_STAGE:-120}
  # Counts rejections of a stage, not failures to improve. Raise it when
  # earlier rejections were about problems fixed elsewhere.
  WORKFLOW_MAX_REVIEW_RERUNS: ${WORKFLOW_MAX_REVIEW_RERUNS:-8}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: ${POSTGRES_DB:-langchain}
    volumes:
      # A directory in this repository rather than a named volume, so the
      # database survives the Docker volumes being removed or recreated - a
      # rebuild that dropped `pgdata` took every account and run record with
      # it. `data/` is gitignored, so none of this is ever committed. Set
      # PGDATA_DIR to keep it somewhere else.
      - ${PGDATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langchain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio:
      #   condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # Web search for the stages (app/tools/web_search.py). Private: no port on the
  # host, reachable only by the app and the worker on the compose network, JSON
  # API on and no rate limiter (docker/searxng/settings.yml). SEARXNG_SECRET is
  # in .env; without it SearXNG does not start and the search tool says so.
  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  worker:
    build: .
    restart: unless-stopped
    # An init as PID 1 that reaps orphans. Celery is PID 1 otherwise, and a
    # product's test servers and their children, once their parent exits, are
    # handed to it and never waited for: zombies accumulate in the worker for
    # the container's life.
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio:
      #   condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/app/data
      # Only mounted when ALLOW_COMMAND_EXECUTION is enabled. Note that access to
      # the Docker socket is equivalent to root on the host: run workers on
      # dedicated nodes, or swap this for a rootless runtime, before enabling
      # execution in a shared environment.
      - ${DOCKER_SOCKET:-/dev/null}:/var/run/docker.sock
    environment:
      <<: *app-env
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-43500}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-43200}
    command:
      - celery
      - -A
      - app.server.tasks
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --max-tasks-per-child=50
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.server.tasks inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          # 4g was not enough for a JavaScript toolchain. Measured on
          # run-cbd22a34: `npx vitest run` forks one worker per CPU, each
          # allowed SANDBOX_MEMORY_LIMIT (2g) of heap by RLIMIT_DATA, and the
          # tree collectively reached memory.peak = 4,294,975,488 - exactly this
          # limit. The kernel killed the Celery workers mid-task
          # (`WorkerLostError: signal 9`), the run was orphaned with its row
          # still reading `running`, and nothing said why.
          #
          # Per-process rlimits do not bound a process tree, so the container
          # limit is the real ceiling. SANDBOX_MEMORY_LIMIT is lowered to 1g
          # below so several concurrent children still fit inside it.
          memory: 8g

volumes:
  # pgdata: replaced by ./data/postgres (see the `db` service). Not declared, so
  # `docker compose down -v` cannot remove the old volume or the new directory.
  redisdata:
  appdata:
  # miniodata:
