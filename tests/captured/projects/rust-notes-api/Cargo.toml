[package]
name = "notes_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
hyperlocal = "0.9"
tokio-test = "0.4"
tempfile = "3"
tower = "0.5"
http-body-util = "0.1"
bytes = "1"

[[bin]]
name = "notes_api"
path = "src/main.rs"

[lib]
name = "notes_api"
path = "src/lib.rs"
