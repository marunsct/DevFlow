name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Python Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system ".[test]"
          uv pip install --system langgraph-checkpoint-sqlite aiosqlite PyJWT bcrypt uvicorn python-multipart sse-starlette

      - name: Compile check (new files)
        run: |
          python -m py_compile src/app/server/run_store.py
          python -m py_compile src/app/server/runner.py
          python -m py_compile src/app/server/api.py
          python -m py_compile src/app/evaluation/evaluators.py

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: "test-key"
          OPENAI_BASE_URL: "http://localhost:1234/v1"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langchain-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: langchain-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t langchain-app:ci .
