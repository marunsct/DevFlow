# SearXNG for the harness's stages (`app.tools.web_search`): a private
# instance on the compose network only, answering the worker in JSON. The
# engines kept are where a developer looks for what a model's training data is
# too old to know - code hosts, Q&A forums, the package registries, MDN and
# Microsoft Learn, the vulnerability database - plus DuckDuckGo and Wikipedia
# as the general pair.
#
# Not kept (plan KS.4, LF.1294):
# - Google, Bing, Brave, Startpage and Mojeek: they refuse a self-hosted
#   instance (403, CAPTCHAs, proof-of-work, weeks-long suspensions; measured
#   here 2026-11-20 and upstream since), and a general query waited on them for
#   up to 10 seconds each time.
# - Stack Overflow, Ask Ubuntu, Super User and GitHub: the harness asks Stack
#   Exchange's and GitHub's own APIs itself, counted and held on a refusal
#   (`app.tools.lookups`); these engines called the same APIs keyless and
#   uncounted, on the same per-address quota.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - wikipedia
      - gitlab
      - codeberg
      - mdn
      - microsoft learn
      - pypi
      - npm
      - crates.io
      - lib.rs
      - rubygems
      - packagist
      - pkg.go.dev
      - hex
      - pub.dev
      - metacpan
      - docker hub
      - hackernews
      - lobste.rs
      - discuss.python
      - arch linux wiki
      - national vulnerability database

general:
  instance_name: "harness search"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # JSON is what the worker reads; the page is for a person checking it by hand.
  formats:
    - html
    - json
  # How long an engine that refused is left alone, in seconds, set here rather
  # than left to defaults that differ between SearXNG's documentation and its
  # shipped file.
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800

server:
  # Only the worker reaches it, so nothing to rate-limit, and no public features.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

engines:
  - name: gitlab
    disabled: false
  - name: codeberg
    disabled: false
  - name: microsoft learn
    disabled: false
  - name: npm
    disabled: false
  - name: crates.io
    disabled: false
  - name: lib.rs
    disabled: false
  - name: rubygems
    disabled: false
  - name: packagist
    disabled: false
  - name: pkg.go.dev
    disabled: false
  - name: hex
    disabled: false
  - name: pub.dev
    disabled: false
  - name: metacpan
    disabled: false
  - name: hackernews
    disabled: false
  - name: lobste.rs
    disabled: false
  - name: discuss.python
    disabled: false
  - name: national vulnerability database
    disabled: false
