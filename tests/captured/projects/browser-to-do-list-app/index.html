<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <h1>Simple To-Do List App</h1>

    <form id="add-form" class="add-form" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" aria-required="true" autocomplete="off">
        <p id="title-error" class="error" hidden>Enter a title to add the task.</p>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="2"></textarea>
      </div>
      <button type="submit" id="add-button" class="primary">Add task</button>
    </form>

    <p id="counter" class="muted" aria-live="polite"></p>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="muted empty" hidden></p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
